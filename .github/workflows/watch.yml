name: watch

on:
  schedule:
    # 時刻は UTC。毎時0分は GitHub が混雑するため7分からずらしている。
    - cron: "7-59/10 21-23,0-14 * * *"  # JST 6:00-23:59 は10分間隔
    - cron: "7 15-20 * * *"             # JST 0:00-5:59 は1時間間隔
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Watch
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
        run: python3 watch.py
      - name: Save state
        if: always()
        run: |
          git add state.json
          if ! git diff --cached --quiet; then
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Update state"
            git push
          fi
